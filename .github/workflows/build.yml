name: TriLink CI & Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Verification Test Suite
  protocol-and-security-tests:
    name: Protocol & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Verification Suite
        run: |
          chmod +x scripts/run_all_tests.sh
          ./scripts/run_all_tests.sh

  # 2. Build Android APK
  build-android:
    name: Build Android APK (Realme & Xiaomi Pad)
    runs-on: ubuntu-latest
    needs: protocol-and-security-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK & Run Tests
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 3. Build macOS Companion
  build-macos:
    name: Build macOS Companion (MacBook Air)
    runs-on: macos-14
    needs: protocol-and-security-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run Swift Tests
        working-directory: ./macos
        run: swift test

      - name: Build macOS Release Binary
        working-directory: ./macos
        run: swift build -c release

      - name: Upload macOS Companion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-macos-companion
          path: macos/.build/release/trilink-mac
          if-no-files-found: error
