name: TriLink CI & Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Verification Test Suite
  protocol-and-security-tests:
    name: Protocol & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Verification Suite
        run: |
          chmod +x scripts/run_all_tests.sh
          ./scripts/run_all_tests.sh

  # 2. Build Android APK
  build-android:
    name: Build Android APK (Realme & Xiaomi Pad)
    runs-on: ubuntu-latest
    needs: protocol-and-security-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 3. Build macOS Companion
  build-macos:
    name: Build macOS Companion (MacBook Air)
    runs-on: macos-14
    needs: protocol-and-security-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Environment
        run: |
          swift --version
          xcode-select -p

      - name: Run Swift Tests
        working-directory: ./macos
        run: swift test -Xswiftc -suppress-warnings

      - name: Build macOS Release Binary
        working-directory: ./macos
        run: swift build -c release -Xswiftc -suppress-warnings

      - name: Package TriLink.app
        run: |
          mkdir -p dist
          ./scripts/package_macos_app.sh ./dist ./macos/.build/release/trilink-mac

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-macos-app
          path: dist/TriLink-macOS.zip
          if-no-files-found: error
