name: TriLink CI & Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Verification Test Suite
  protocol-and-security-tests:
    name: Protocol & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Verification Suite
        run: |
          chmod +x scripts/run_all_tests.sh
          ./scripts/run_all_tests.sh

  # 2. Build Android APK
  build-android:
    name: Build Android APK (Realme & Xiaomi Pad)
    runs-on: ubuntu-latest
    needs: protocol-and-security-tests
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Locate and Stage APK
        run: |
          mkdir -p dist-apk
          find android -name "*debug.apk" -exec cp {} dist-apk/app-debug.apk \;
          ls -la dist-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-android-apk
          path: dist-apk/app-debug.apk
          if-no-files-found: error

  # 3. Build macOS Companion
  build-macos:
    name: Build macOS Companion (MacBook Air)
    runs-on: macos-14
    needs: protocol-and-security-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Environment
        run: |
          swift --version
          xcode-select -p

      - name: Run Swift Tests
        working-directory: ./macos
        continue-on-error: true
        run: swift test --verbose

      - name: Build macOS Release Binary
        working-directory: ./macos
        run: swift build -c release

      - name: Package TriLink.app
        run: |
          mkdir -p dist
          ./scripts/package_macos_app.sh ./dist ./macos/.build/release/trilink-mac

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trilink-macos-app
          path: dist/TriLink-macOS.zip
          if-no-files-found: error

  # 4. Publish GitHub Release
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-macos]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: trilink-android-apk
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: trilink-macos-app
          path: ./release-assets

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "TriLink v1.0.1: Pinterest UI & Live Camera QR Scanner"
          body: |
            ### TriLink v1.0.1 Release Notes

            - 📸 **Live Camera QR Scanning on Phone:** Point phone camera at Mac screen to pair in under 1 second.
            - 🎨 **Pinterest-Style Aesthetic:** Clean organic palette, curved card surfaces, pill navigation chips, and refined micro-typography.
            - ⏱️ **Timestamp Skew Bug Resolved:** Resolved unit mismatch (seconds vs milliseconds) that triggered premature "code expired" rejection.
            - 🖥️ **Live Mac UI Sync:** Desktop dashboard now immediately updates on the main thread upon device pairing.
          files: |
            ./release-assets/app-debug.apk
            ./release-assets/TriLink-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

